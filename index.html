<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:;base64,=">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Добро пожаловать в игру Пирамидка!</h1>
        <input type="text" id="playerName" placeholder="Введите ваше имя">
        
        <div class="difficulty-selector">
            <h2>Выберите уровень сложности:</h2>
            <div>
                <label>
                    <input type="radio" name="difficulty" value="easy"> Легкий
                </label>
                <label>
                    <input type="radio" name="difficulty" value="medium"> Средний
                </label>
                <label>
                    <input type="radio" name="difficulty" value="hard"> Сложный
                </label>
            </div>
        </div>
        
        <button id="startGame" disabled>Начать</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
